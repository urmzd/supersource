id       = "matmul"
title    = "matmul: Python (M03.1) and the optional C kernel (L9.1) against numpy float64"
equality = "matmul-bound"          # |c - c64| <= 4 eps32 sqrt(K) max(|A| @ |B|)
golden   = "course/fixtures/parity/matmul.json"

[fuzz]
generator = "gen/matmul.py"
oracle    = "gen/matmul_oracle.py"     # float64 answers the C output is held to
cases     = 100

# Each side runs as its own process: the Python matmul of M03.1 and the
# standalone C kernel of L9.1 (optional).
[[impl]]
name   = "python"
module = "M03.1"
lang   = "python"
driver = "drivers/matmul.py"

[[impl]]
name   = "c-tiled"
module = "L9.1"
lang   = "c"
driver = "drivers/matmul.c"
