id       = "tokenizer.bpe"
title    = "Python byte-level BPE (L1.2) vs Rust tl-tok (L1.5)"
equality = "exact"                 # bit-exact ids
golden   = "course/fixtures/tok-gpt2/parity.json"   # tiktoken GPT-2 ids (B4 oracle)

[fuzz]
generator = "gen/text.py"          # seeded Unicode text, 2,000 cases
cases     = 2000

[[impl]]
name   = "python"
module = "L1.2"
lang   = "python"
driver = "drivers/tokenizer_bpe.py"

[[impl]]
name   = "rust"
module = "L1.5"
lang   = "rust"
driver = "drivers/tokenizer_bpe.rs"
