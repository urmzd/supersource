id       = "rng"
title    = "PCG32 (spec/pcg32.md): u32 stream, uniform_f64, Box-Muller normals"
equality = "ulp"                   # u32 and uniforms bit-exact; Box-Muller normals
ulp      = 4                       # within 4 ulp (spec/pcg32.md): libm sin, cos, log differ
ulp_keys = ["normal"]              # by 1 to 2 ulp across Go, Rust, and Python
golden   = "course/fixtures/parity/rng.json"

[fuzz]
generator = "gen/rng.py"           # random 64-bit seeds and streams
cases     = 200

# Drivers land with their modules (Python in M06.3, Rust in L10.1, Go in
# load.01); each implementation is checked through a process boundary.
[[impl]]
name   = "python"
module = "M06.3"
lang   = "python"
driver = "drivers/rng.py"

[[impl]]
name   = "rust"
module = "L10.1"
lang   = "rust"
driver = "drivers/rng.rs"

[[impl]]
name   = "go"
module = "load.01"
lang   = "go"
driver = "drivers/rng.go"
