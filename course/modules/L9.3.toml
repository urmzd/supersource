id        = "L9.3"
title     = "FlashAttention forward in C"
kind      = "build"
lang      = ["c"]
pass      = 6
chapter   = "ml/08-tinyllm/p09-kernels/06-flash-attention-forward.md"
contract  = ["contracts/c/include/tinyllm/attention.h"]
# flash_attn.c: rt.01's error slot, rt.02's arena (the scratch tiles),
# rt.03's tl_parallel_for, M09.6's tl_expf. The C tests build the naive
# oracle with L9.2's tl_softmax_f32; the Python tests compare with L7.7's
# windowed_attention and L5.1's sdpa_forward.
deps      = ["rt.01", "rt.02", "rt.03", "M09.6", "L9.2", "L7.7", "L5.1"]
reading   = ["L5.2", "L7.5"]   # mask flags and GQA head sharing, as concepts
# L9.7 runs prefill attention through it; L9.4's tests hold paged decode to
# it bitwise. L10.1 (prefill) and L10.3 (chunked prefill) join when they
# list L9.3 in deps (B9, DEVIATIONS B84-01).
used_by   = ["L9.4", "L9.7"]
units     = ["c/src/kernels/flash_attn.c"]
upgrades  = []
milestone = "MS-L9"
ci        = "pr"

[tests]
dir       = "course/tests/L9.3"
smoke     = ["hand_example", "test_hand_example_through_ctypes"]
sanitize  = ["thread"]              # the pool test also runs under ThreadSanitizer
timeout_s = 120
determinism_runs = 2
