id        = "ds.04"
title     = "Binary heap top-k in C"
kind      = "build"
lang      = ["c"]
pass      = 6
chapter   = "algorithms/16-systems-data-structures/04-binary-heap-top-k.md"
contract  = ["contracts/c/include/tinyllm/topk.h"]
# topk.c reaches rt.01's error slot; the Python tests load the library with
# rt.01's loader and compare with L8.1's process_logits (spec step 6).
