reading   = ["ds.06", "ds.01"]
# Call site: L10.1's Rust sampler calls tl_topk_f32 through tl-sys; it joins
# used_by when L10.1 lists ds.04 in deps (B9, DEVIATIONS B84-01).
used_by   = []
units     = ["c/src/ds/topk.c"]
upgrades  = []
milestone = "MS-P6"
ci        = "pr"

[tests]
dir       = "course/tests/ds.04"
# One C and one Python name: smoke names run in every test language.
smoke     = ["hand_example", "test_hand_example_through_ctypes"]
timeout_s = 60
determinism_runs = 2

