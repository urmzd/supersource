id        = "L10.0"
title     = "Your first endpoint: a std-only Rust HTTP/1.1 + SSE server over the C matmul"
kind      = "build"
lang      = ["rust"]
pass      = 1
chapter   = "ml/08-tinyllm/p10-serving/00-your-first-endpoint.md"
# The v0 HTTP surface and the engine role; the model directory formats and
# the C headers it links are linked from the chapter card.
contract  = ["contracts/openapi/openai-subset.v0.yaml", "contracts/spec/cli-roles.md"]
deps      = ["M03.1", "rt.01", "L0.0"]   # tl_matmul_f32 and the error slot in C; L0.0 writes the checkpoint it serves
reading   = ["lang.04", "lang.05"]       # primers: Rust and std::net; HTTP, JSON, SSE by hand
# Call sites (DESIGN 4.3): dep.00 builds the engine into its image and obs.00
# traces it; gw.00 only proxies to it over HTTP (reading). L10.1 and L10.5
# take the units over later.
used_by   = ["L10.1", "dep.00", "obs.00"]
units     = [
  "rust/crates/tl-serve/src/http.rs",    # v0, std only; L10.5 takes it over
  "rust/crates/tl-serve/src/lib.rs",     # crate root (glue: `pub mod http;`), 2.15
  "rust/crates/tl-sys/src/lib.rs",       # v0, minimal extern "C"; L10.1 takes it over
]
upgrades  = []
milestone = "MS-P1"
ci        = "pr"

[tests]
dir       = "course/tests/rust/l10_0.rs"
smoke     = ["hand_example_completion", "stream_framing_is_exact", "abi_version_is_1"]
timeout_s = 120
determinism_runs = 2
