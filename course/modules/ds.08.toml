timeout_s = 120
determinism_runs = 2

[fixtures]
files = ["course/fixtures/parity/bloom.json"]

[learner_tests]                     # rung R4: properties (craft.04)
rung      = 4
path      = "rust/crates/tl-ds/tests/ds08_bloom.rs"
