id        = "ds.08"
title     = "Bloom filter"
kind      = "build"
lang      = ["rust"]
pass      = 3
chapter   = "algorithms/16-systems-data-structures/08-bloom-filter.md"
# formats/bloom.md and py/tinyllm_rs.pyi (Bloom) are linked from the chapter
# card; they carry no `chapter:` back-pointer yet (DEVIATIONS B43-02).
contract  = []
deps      = ["L1.5"]                # tl-py's crate root (L1.5) registers tinyllm_rs.Bloom
reading   = ["S-M06b", "M06.3"]     # FP rate and optimal k; FNV-1a and the SplitMix finalizer
# data.03 builds its exact-dedup screen with tinyllm_rs.Bloom.
used_by   = ["data.03"]
units     = [
  "rust/crates/tl-ds/src/bloom.rs",
  "rust/crates/tl-py/src/bloom.rs",
]
upgrades  = []
milestone = "MS-corpus"
ci        = "pr"

[tests]
