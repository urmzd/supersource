id        = "gw.07"
title     = "Usage ledger, metering, admin API"
kind      = "build"
lang      = ["go"]
pass      = 7
chapter   = "ai-platform-engineering/12-gateway/07-usage-ledger-and-admin-api.md"
# The ledger implements formats/usage.v1.sql and the server side of
# openapi/admin.v1.yaml. Both are listed in the chapter card; they join
# `contract` once their headers point back at the chapter (DEVIATIONS B94-01).
contract  = ["contracts/formats/usage.v1.sql", "contracts/openapi/admin.v1.yaml"]
# gw.01: the Middleware type, the Exchange, WriteError, and the chain the
# meter sits in; gw.02: the Principal (tenant, key id, the admin scope).
deps      = ["gw.01", "gw.02"]
reading   = ["lang.11", "ai-platform-engineering/12-gateway"]   # SQL and SQLite: the primer whose exercises are this module's queries
used_by   = ["dep.01"]       # dep.01 builds the gateway image around it (CGO off: the pure-Go SQLite driver); ag.04's query_usage tool joins in B12
units     = ["go/gateway/ledger/ledger.go", "go/gateway/ledger/meter.go", "go/gateway/ledger/admin.go"]
upgrades  = []
milestone = "MS-gateway"
ci        = "pr"

[tests]
dir       = "course/tests/go/gw_07/"
smoke     = ["TestHandWorkedExample", "TestSchemaMatchesContract", "TestLedgerSumEqualsEngineUsage"]
timeout_s = 120
determinism_runs = 2
