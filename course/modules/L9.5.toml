id        = "L9.5"
title     = "Fused int4 and int8 dequantize-matmul in C"
kind      = "build"
lang      = ["c"]
pass      = 6
chapter   = "ml/08-tinyllm/p09-kernels/08-fused-quantized-matmul.md"
contract  = ["contracts/c/include/tinyllm/qmatmul.h"]
# qmatmul.c: rt.01's error slot, M09.4's tl_f16_to_f32 (the scales), and
# rt.03's tl_parallel_for (with a pool). The C tests build their float32
# baseline with L9.1's tl_matmul_f32 and encode scales with M09.4's
# tl_f32_to_f16; the Python tests load the library with rt.01's loader and
# quantize with L8.5's quantize_int4_group and quantize_int8_per_channel
# (the parity suite quant.int4 ties the byte layout to L8.5 as well).
deps      = ["rt.01", "rt.03", "M09.4", "L9.1", "L8.5"]
reading   = ["M09.3"]
# Call site: L10.1's quantized runner (*.q4.safetensors) joins used_by when
# it lists L9.5 in deps (B9, DEVIATIONS B84-01).
used_by   = ["L10.1"]
units     = ["c/src/kernels/qmatmul.c"]
upgrades  = []
milestone = "MS-L9"
ci        = "pr"

[tests]
dir       = "course/tests/L9.5"
smoke     = ["hand_example", "test_hand_example_through_ctypes"]
timeout_s = 60
determinism_runs = 2

[bench]                             # a B test: `ss bench L9.5 --assert`, never `ss check`
lang   = "c"
name   = "q4_gemv_2048"             # course/tests/L9.5/bench/q4_gemv_2048.c
metric = "q4_speedup_vs_f32"        # one decode step, M = 1, N = K = 2048, group 32
budget = ">= 2"
