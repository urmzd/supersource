id        = "L9.7"
title     = "The Python C backend: the Llama forward through libtinyllm, with a load-time op check"
kind      = "build"
lang      = ["python"]
pass      = 6
chapter   = "ml/08-tinyllm/p09-kernels/10-python-c-backend.md"
contract  = ["contracts/py/tinyllm/backend/c.pyi"]
# c.py calls L9.1's tl_matmul_f32 (the upgraded M03.1 unit), L9.3's
# tl_flash_attn_fwd_f32, and L9.6's elementwise kernels through rt.01's
# ctypes loader; it takes L7.9's LlamaForCausalLM (state_dict, rope_spec)
# and divides each op's error by M09.3's bounds in the load-time check.
deps      = ["L9.1", "L9.3", "L9.6", "rt.01", "M09.3", "L7.9"]
# Concepts only: the online softmax inside L9.3 (L9.2), paged decode and
# the quantized matmul the Rust engine uses instead (L9.4, L9.5), and
# oracle and differential testing (craft.05).
reading   = ["L9.2", "L9.4", "L9.5", "craft.05"]
# Call site (DESIGN 4.3): L10.1 compares the Rust runner's logits with
# `--backend c`. It is not registered yet (B9), so verify check 9 fails until
# L10.1 lists L9.7 in deps (DEVIATIONS B85-01).
used_by   = []
units     = ["python/tinyllm/backend/c.py"]
upgrades  = []
milestone = "MS-L9"
ci        = "pr"

[tests]
dir       = "course/tests/L9.7"
smoke     = ["test_hand_example_linear_bias_and_rope", "test_tiny_hf_logits_golden"]
timeout_s = 120
determinism_runs = 2

[fixtures]
files = [
  "course/fixtures/L7.9/hf_logits.npz",
  "course/fixtures/L7.9/tiny-llama-2l/config.json",
  "course/fixtures/L7.9/tiny-llama-2l/model.safetensors",
  "course/fixtures/L7.9/tiny-mistral-swa/config.json",
  "course/fixtures/L7.9/tiny-mistral-swa/model.safetensors",
  "course/fixtures/L7.9/tiny-qwen2/config.json",
  "course/fixtures/L7.9/tiny-qwen2/model.safetensors",
  "course/fixtures/L7.9/tiny-llama3-rope/config.json",
  "course/fixtures/L7.9/tiny-llama3-rope/model.safetensors",
  "course/fixtures/L7.9/tiny-yarn/config.json",
  "course/fixtures/L7.9/tiny-yarn/model.safetensors",
  "course/fixtures/L7.9/tiny_greedy_32.json",
]

# Rung R7 (DESIGN 5.12): 0.90 of the unit mutants, every tagged one. The
# perf-mutant half of R7 is graded on craft.06's kata (DEVIATIONS B85-03).
[learner_tests]
rung      = 7
path      = "python/tests/l9-7-backend"
threshold = 0.90
required_mutants = ["s01", "s03", "s04", "s12", "s13"]
time_budget_s = 60
