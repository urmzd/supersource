apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: engine
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The tracer form of spec/cli-roles.md: flags, no config file.
          args:
            - --model-dir
            - {{ .Values.modelDir | quote }}
            - --port
            - {{ .Values.port | quote }}
            - --health-port
            - {{ .Values.healthPort | quote }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ .Release.Name | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otlpEndpoint | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            - name: health
              containerPort: {{ .Values.healthPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: artifacts
          hostPath:
            path: {{ .Values.artifactsHostPath }}
            type: Directory
