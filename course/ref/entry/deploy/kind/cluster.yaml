# The tracer cluster (dep.00). From the repo root:
#   kind create cluster --config deploy/kind/cluster.yaml
# kind resolves a relative hostPath against the directory you run it from.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: forge
nodes:
  - role: control-plane
    # Port mappings are fixed when the node container is created: adding one
    # later means deleting and recreating the cluster (dep.02 does that).
    extraPortMappings:
      - containerPort: 30080   # gateway NodePort
        hostPort: 30080
        listenAddress: "127.0.0.1"
      - containerPort: 30686   # Jaeger query NodePort
        hostPort: 30686
        listenAddress: "127.0.0.1"
    # ./artifacts on your machine is /artifacts on the node; pods mount it
    # with a hostPath volume (DESIGN 2.13).
    extraMounts:
      - hostPath: ./artifacts
        containerPath: /artifacts
        readOnly: true
