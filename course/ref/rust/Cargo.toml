# rust/Cargo.toml: the Cargo workspace of the Rust side of the system
# (DESIGN 2.15). `ss start` copies it into your repo only when you have none,
# and never rewrites it: add members and dependencies here yourself as later
# modules create crates (tl-ds, tl-tok, tl-py, tl-engine).
[workspace]
resolver = "2"
members = ["crates/tl-sys", "crates/tl-serve", "crates/tl-ds", "crates/tl-tok", "crates/tl-py", "crates/tl-engine", "crates/tl-kv-format"]
