# tl-engine: the inference engine library (DESIGN 2.1). L8.4 creates the
# crate with the radix prefix cache (src/prefix.rs) over tl-ds's radix tree
# (ds.07). L10.1 adds the model runner over the C kernels (tl-sys), the
# safetensors reader (memmap2, serde_json), and the sampler; L10.2 to L10.5
# add the scheduler, chunked prefill, the block manager, and the engine
# loop, each one more `pub mod` line in src/lib.rs. Dependencies are those
# contracts/allowed-deps.toml lists for rust.tl-engine.
[package]
name = "tl-engine"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
tl-ds = { path = "../tl-ds" }
tl-sys = { path = "../tl-sys" }
anyhow = "1"
memmap2 = "0.9"
serde_json = "1"

[dev-dependencies]
proptest = "1"
