# tl-py: the PyO3 module `tinyllm_rs` (contracts/py/tinyllm_rs.pyi, DESIGN 2.5).
# L1.5 owns the crate root and tok.rs; ds.08 adds bloom.rs.
#
# Build contract: a cdylib with PyO3's abi3-py311 and extension-module
# features; on macOS the cdylib links with `-undefined dynamic_lookup`
# (build.rs). `ss` builds it with PYO3_PYTHON set to your uv interpreter and
# copies the library to tinyllm_rs.so; maturin is optional.
[package]
name = "tl-py"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "tl_py"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }
tl-ds = { path = "../tl-ds" }
tl-tok = { path = "../tl-tok" }
