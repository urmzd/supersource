# the prost and tonic output that the contracts commit. Never vendored.
[package]
name = "tl-proto-gen"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"

