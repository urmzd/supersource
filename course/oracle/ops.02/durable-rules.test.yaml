# promtool unit tests for course/ref/entry/deploy/observability/rules/durable.yaml
# (run by check-durable-rules.sh next to this file).
rule_files: [rules.yaml]
evaluation_interval: 5s
tests:
  # durable-kill9: a redelivery storm (2 per 15 s) fires; normal churn (1 per 5 min) does not.
  - interval: 15s
    input_series:
      - series: 'tl_durable_redeliveries_total{namespace="forge",queue="data"}'
        values: '0+0x8 0+2x16'
      - series: 'tl_durable_redeliveries_total{namespace="forge",queue="default"}'
        values: '0+0x20 1+0x20'
    alert_rule_test:
      - eval_time: 1m
        alertname: DurableRedeliveriesSpike
        exp_alerts: []
      - eval_time: 4m
        alertname: DurableRedeliveriesSpike
        exp_alerts:
          - exp_labels: {severity: page, namespace: forge, queue: data}
            exp_annotations:
              summary: "data: 14 redeliveries in 2 minutes"
              runbook: docs/runbooks/DurableRedeliveriesSpike.md
  # poison-task: one dead letter pages after 15 s; zero never does.
  - interval: 5s
    input_series:
      - series: 'tl_durable_dlq_size{namespace="forge",queue="data"}'
        values: '0x10 1x20'
      - series: 'tl_durable_dlq_size{namespace="forge",queue="default"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 45s
        alertname: DurableDeadLetters
        exp_alerts: []
      - eval_time: 75s
        alertname: DurableDeadLetters
        exp_alerts:
          - exp_labels: {severity: page, namespace: forge, queue: data}
            exp_annotations:
              summary: "data: 1 dead-lettered task(s)"
              runbook: docs/runbooks/DurableDeadLetters.md
