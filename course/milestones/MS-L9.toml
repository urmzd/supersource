# -- 2. nightly: SmolLM2-135M-Instruct through --backend c ----------------------------
[[step]]
name      = "smollm2-pull"
ci        = "nightly"
run       = "tinyllm"
argv      = ["pull", "HuggingFaceTB/SmolLM2-135M-Instruct", "--revision", "12fd25f77366fa6b3b4b768ec3050bf629380bac",
             "--cache-dir", "{models}"]
expect    = { match = "regex", pattern = '"dir": ".*HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac"' }
timeout_s = 1800

# Token-exact against HF greedy on the 8 margin-filtered prompts: the
# --backend numpy result of MS-L7, now from your kernels.
[[step]]
name      = "smollm2-c-greedy"
ci        = "nightly"
run       = "tinyllm"
argv      = ["generate", "--model", "{models}/HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac",
             "--prompt-file", "{fixture:smollm2-parity/prompts.txt}", "--greedy", "--max-tokens", "32", "--backend", "c", "--check"]
expect    = { match = "tokens-equal", file = "course/fixtures/smollm2-parity/greedy_32.json" }
timeout_s = 1800

# -- 3. local: decode speed ------------------------------------------------------------
# 0.001 x the calibrated decode steps per second: one SmolLM2 token is about
# 134M multiply-adds, 128 of the calibration's 1M-MAC GEMV steps, so this
# asks for about 13% of the machine's plain-C GEMV rate. speedup_c is
# reported, not gated: numpy's matmul is the platform BLAS (B85-02).
[[step]]
name      = "smollm2-decode-speed"
ci        = "local"
run       = "tinyllm"
argv      = ["bench", "decode", "--model", "{models}/HuggingFaceTB--SmolLM2-135M-Instruct/12fd25f77366fa6b3b4b768ec3050bf629380bac",
             "--backend", "numpy,c", "--tokens", "128"]
expect    = { match = "perf", metric = "tok_s_c", budget = ">= 0.001 * decode_tok_s" }
timeout_s = 1800
