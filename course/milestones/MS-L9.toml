# MS-L9: the Part 9 milestone (DESIGN 4.3 "MS-L9", 5.7, 7.2). MS-P6 includes it.
# Page: paths/course-p06-inference-and-kernels/milestone.md (B8 paths work).
#
# Your C kernels, run through your own entry point: the Llama forward of
# L7.9, op by op in libtinyllm through L9.7's backend, loads with every op
# inside its M09.3 error bound, gives Hugging Face's logits, and decodes
# HF's greedy continuation token for token, exactly as --backend numpy does
# in MS-L7. PR CI runs it on the committed tiny model; the nightly run pulls
# SmolLM2-135M-Instruct with your downloader; the decode benchmark is a
# local perf step.
#
# This file fixes the Pass 6 kernel forms of your `tinyllm` role
# (spec/cli-roles.md, "Verbs of later passes": generate and bench with
# --backend). Every verb keeps the rules of that page: exit 2 on a usage
# error, the last stdout line is one JSON object.
#
#   {tinyllm} generate --model <llama dir> (--prompt <text> | --prompt-file <file>)
#                 --backend {numpy,c} [--check] [--max-tokens N] [--greedy | --temperature T]
#                 [--seed S] [--out FILE]
#       MS-L7's generate, through the chosen backend. --backend c is
#       L9.7's CBackend over the libtinyllm in $TINYLLM_LIB (else your
#       c/build/libtinyllm.*), with its own KV cache and tl_argmax_f32 for
#       --greedy. --check runs L9.7's load-time op check first: one line per
#       op on stderr, and a failed op exits 1 before any token with
#       {"check": {...}, "ok": false} as the final line. Final line:
#       {"ids": [...], "text": ..., "backend": "c", "per_prompt" (with
#        --prompt-file), "check": {op: ratio}, "check_max_ratio" (with --check)}.
#
#   {tinyllm} logits --model <llama dir> --prompt <text> [--prefix-ids a,b,...] --backend {numpy,c} [--check]
#       MS-L7's logits through the chosen backend. Final line:
#       {"logits": [<vocab floats>]} and nothing else on stdout.
#
#   {tinyllm} bench decode --model <llama dir> --backend numpy,c [--tokens N] [--prompt <text>]
#       Greedy decode of N tokens after the prompt with each backend (one
#       warm-up, then the best of three runs). Final line:
#       {"tokens": N, "tok_s_numpy": ..., "tok_s_c": ..., "speedup_c": c / numpy}.
#
# Sanitizers (DESIGN 4.3 MS-L9 (3)): `requires` lists every Part 9 runtime
# and kernel module; each one's fresh pass ran its course C harness under
# ASan and UBSan with the counting allocator (ss check builds that harness
# sanitized), so a milestone run that counts has a sanitizer-clean harness
# behind it (DEVIATIONS B85-05). The perf step is relative to the machine
# (ss bench --calibrate), not to numpy (DEVIATIONS B85-02).
#
# `ss milestone MS-L9 --smoke` runs the three tiny-model steps (seconds).
id       = "MS-L9"
title    = "Your C kernels run the Llama forward and match Hugging Face token for token"
requires = ["rt.02", "rt.03", "L9.1", "L9.2", "L9.3", "L9.4", "L9.5", "L9.6", "L9.7", "craft.06"]
pass     = 6
ci       = "pr"

# -- 1. the committed tiny model through --backend c ---------------------------------
[[step]]
name      = "tiny-c-greedy"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--prompt-file", "{fixture:L7.9/margin-prompts.txt}",
             "--greedy", "--max-tokens", "32", "--backend", "c"]
expect    = { match = "tokens-equal", file = "course/fixtures/L7.9/tiny_greedy_32.json" }
timeout_s = 120

# Every op inside its M09.3 bound on this model's shapes and weights.
[[step]]
name      = "tiny-c-check"
smoke     = true
run       = "tinyllm"
argv      = ["generate", "--model", "{fixture:L7.9/tiny-llama-2l/config.json}", "--prompt", "Once upon a time",
             "--greedy", "--max-tokens", "4", "--backend", "c", "--check"]
expect    = { match = "json-last-line", metrics = { check_max_ratio = "<= 1" } }
timeout_s = 120

