# Optional local post-training capstone. The v1.0.0 core course ends at C1.
id       = "MS-C2"
title    = "Post-training improves the TinyStories model on held-out preference tasks"
requires = ["C2", "L12.1", "L12.2", "L12.3", "L12.4", "S-M10b"]
pass     = 10
ci       = "local"
includes = []

[[step]]
name   = "post-trained-reward-gain"
run    = "tinyllm"
argv   = ["eval", "compare", "--base", "artifacts/c1/model", "--candidate", "artifacts/c2/model", "--suite", "{fixture:post-training/heldout.jsonl}"]
expect = { match = "json-last-line", metrics = { reward_delta = "> 0", p_value = "< 0.05" } }
timeout_s = 1800

[[step]]
name   = "distilled-student-parity"
run    = "tinyllm"
argv   = ["post", "distill", "--teacher", "artifacts/c1/model", "--student", "artifacts/c2/distilled", "--data", "{fixture:post-training/distill.jsonl}", "--out", "{out}/distill.json"]
expect = { match = "json-last-line", metrics = { heldout_kl = "<= 0.25", teacher_id_match = "== 1" } }
timeout_s = 1800
