# contracts/rust/tl-proto: prost and tonic output for proto/tl/*/v1 (DESIGN
# 2.7), committed with no build.rs, so the learner never runs protoc. The
# learner's crates depend on it by path:
#   tl-proto = { path = "../../../contracts/rust/tl-proto" }
# Regenerated by maintainers with course/oracle/contracts/gen-proto.sh.
[package]
name = "tl-proto"
version = "0.2.0"
edition = "2021"
publish = false
description = "Generated gRPC types and services of the tinyllm contracts"

[lib]
path = "src/lib.rs"

[dependencies]
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
