# craft.08's seeded pull request (hidden: honor system, D34; course/mutants is
# never exported). course/oracle/craft.08/make_pr.py writes pr.patch, the
# defect patches s01 to s05, and manifest.tsv from the current gw.03
# reference; this file holds the rest: the branch, its commits, the lines the
# PR gets right on purpose (decoys), and the grading thresholds.
#
# The check builds the PR in a scratch clone of your repo (DESIGN 5.10
# git-branch, X25) and fetches it into your repo as drill/<name>. Your own
# files are never patched: the first commit replaces the unit with the course
# reference, the next two are the change under review.

name   = "craft-08"                                  # branch drill/craft-08
module = "gw.03"                                     # whose reference the PR starts from
unit   = "go/gateway/limit/limit.go"
test   = "go/gateway/limit/idle_evict_test.go"       # the PR's own test file (new)
review = "docs/reviews/craft-08-pr-review.toml"      # your findings

[[commit]]
writes  = "reference"
message = """chore(review): start from the course reference of go/gateway/limit/limit.go

Review setup, not part of the pull request. This commit replaces your
limit.go with gw.03's course reference, so the two commits after it are
exactly the change under review:

    git diff drill/craft-08~2 drill/craft-08
"""

[[commit]]
writes  = "head"
message = """fix(limit): evict idle keys so the bucket map stays bounded

The limiter keeps one keyState per API key for the life of the process.
Keys are cheap to mint (`keys create`), and a load test that minted a key
per tenant per run grew the gateway's heap past 1 GB. This adds a sweep
that drops keys idle for IdleTTL (2 minutes) once their buckets are full
again, runs it on every 256th Reserve so its cost is amortized, and adds
Len() for a keys gauge.

While here, RetryAfterSeconds is tidied to one line.
"""

[[commit]]
writes  = "test"
message = """test(limit): cover idle-key eviction
"""

[grade]
min_found     = 4      # of the 5 seeded defects, at any severity
max_unmatched = 1      # blocking or major findings on limit.go that hit no seeded defect
max_serious   = 10     # blocking plus major findings in total (no shotgun reviews)
tolerance     = 1      # a finding may point one line above or below a defect's changed lines

# Lines the PR gets right on purpose. A blocking or major finding on one of
# them (within `tolerance`) fails the review: it would block a correct change.
[[decoy]]
line = "st.open--"
why  = "adjust runs at most once per reservation: Settle and Cancel share a sync.Once"

[[decoy]]
line = "st.seen = now"
why  = "a rejected key that keeps calling stays resident, and its bucket is not full anyway"

[[decoy]]
line = "st.open++"
why  = "only an admitted request holds a reservation; a rejected one returns before this line"
