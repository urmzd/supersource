# MS-corpus fixture config (formats/corpus-config.schema.json). Relative
# source urls and protected paths resolve against this file's directory.
dataset = "small"
version = "v1"

[[sources]]
id = "stories"
url = "sources/stories.jsonl"
sha256 = "21bc6b436a74c1718ebd408ca437b33609af07e9f0dd5fe116b742c58f63c925"
license_spdx = "CC0-1.0"
format = "jsonl"

[[sources]]
id = "notes"
url = "sources/notes.txt"
sha256 = "0982201678874722477cb2ad05a3045ec424b864a5c9fa452fc6719b33dfc57e"
license_spdx = "GPL-3.0-only"
format = "text"

[filters]
min_chars = 50
langs = ["en"]

[dedup]
jaccard_threshold = 0.8
num_perm = 128
bands = 16
shingle = 5
seed = 0

[decontam]
protected = ["protected/stories-val.jsonl"]
ngram = 13

[shard]
shard_rows = 64
val_permille = 100

[tokenizer]
id = "bytes"
