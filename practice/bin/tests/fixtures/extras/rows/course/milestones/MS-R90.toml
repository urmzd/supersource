id       = "MS-R90"
title    = "Your corpus stage writes parquet shards with every row"
requires = []
pass     = 1
ci       = "pr"

[[step]]
name   = "shards"
run    = "ctl"
argv   = ["{out}", "{rows}"]
vars   = { rows = "1200" }
smoke_vars = { rows = "120" }
smoke  = true

[[step]]
name   = "shards hold the rows"
smoke  = true
expect = { match = "file-produced", glob = "{out:shards}/shard-*.parquet", min_count = 2, rows = ">= 1200" }
