id       = "MS-T90"
title    = "Your trainer reaches the reference loss"
requires = []
pass     = 1
ci       = "pr"

[[step]]
name       = "train"
run        = "ctl"
smoke      = true
argv       = ["--steps", "{steps}", "--seed", "{seed}"]
vars       = { steps = "2000" }
smoke_vars = { steps = "200" }
expect     = { match = "json-last-line", metrics = { loss = "<= calibrated", steps = ">= 1" } }
