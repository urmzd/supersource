# fixture contract (harness self-tests only)
openapi: 3.1.0
info:
  title: OpenAI subset v1, fixture copy for the harness self-tests
  version: 1.0.0
paths:
  /healthz:
    get:
      responses:
        '200':
          description: healthy
  /v1/models:
    get:
      responses:
        '200':
          description: served models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          description: missing key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/chat/completions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 'a chat completion, or an SSE stream of chunks ending in data:
            [DONE]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              x-tl-chunk:
                $ref: '#/components/schemas/ChatChunk'
        '400':
          description: invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: missing or unknown key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: key lacks the scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: unsupported parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '451':
          description: blocked by the usage policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          - type
          - param
          - code
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type:
              - string
              - 'null'
            code:
              type:
              - string
              - 'null'
    ModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          const: list
        data:
          type: array
          items:
            type: object
            required:
            - id
            - object
            properties:
              id:
                type: string
              object:
                const: model
    Message:
      type: object
      required:
      - role
      properties:
        role:
          enum:
          - system
          - user
          - assistant
          - tool
        content:
          type:
          - string
          - 'null'
    ChatRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        seed:
          type: integer
        stream:
          type: boolean
        stop:
          type: array
          items:
            type: string
    ToolCall:
      type: object
      required:
      - id
      - type
      - function
      properties:
        id:
          type: string
        type:
          const: function
        function:
          type: object
          required:
          - name
          - arguments
          properties:
            name:
              type: string
            arguments:
              type: string
    ChatCompletion:
      type: object
      required:
      - id
      - object
      - created
      - model
      - choices
      - usage
      properties:
        id:
          type: string
        object:
          const: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - index
            - message
            - finish_reason
            properties:
              index:
                type: integer
              message:
                type: object
                required:
                - role
                - content
                properties:
                  role:
                    const: assistant
                  content:
                    type:
                    - string
                    - 'null'
                  tool_calls:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolCall'
              finish_reason:
                enum:
                - stop
                - length
                - tool_calls
        usage:
          type: object
          required:
          - prompt_tokens
          - completion_tokens
          - total_tokens
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
    ChatChunk:
      type: object
      required:
      - id
      - object
      - created
      - model
      - choices
      properties:
        id:
          type: string
        object:
          const: chat.completion.chunk
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - index
            - delta
            - finish_reason
            properties:
              index:
                type: integer
              delta:
                type: object
              finish_reason:
                type:
                - string
                - 'null'
                enum:
                - stop
                - length
                - tool_calls
                - null
