id    = "ops.96"
title = "Durable faults: a WAL quota, a poisoned activity, a skewed clock, a noisy tenant"

[[inject]]
kind       = "wal-quota"
target     = "{deploy.services.durable}"
bytes      = 4096
burst_argv = ["burst", "--n", "3"]

[[inject]]
kind      = "activity-poison"
target    = "{deploy.services.gateway}"
failpoint = "dur/activity/shard-3"

[[inject]]
kind   = "clock-skew"
url    = "{deploy.durable_debug_url}/debug/clock"
skew_s = 7200

[[inject]]
kind   = "tenant-flood"
tenant = "acme"
rate   = 50
