id    = "ops.94"
title = "Review a seeded pull request"
symptom = "REVIEW: a teammate opened drill/seeded-pr; find the bug before it merges"

[[inject]]
kind   = "git-branch"
branch = "seeded-pr"

[[inject.commit]]
kind    = "seeded"
module  = "M90.1"
mutant  = "s01"
message = "perf: scale in place to save an allocation"

[[inject.commit]]
kind    = "write"
path    = "docs/notes/scale.md"
text    = "# Scale\n\nNow in place.\n"
message = "docs: note the in-place scale"

[[inject.commit]]
kind    = "run"
argv    = ["sh", "-c", "echo 2 > VERSIONFILE"]
message = "chore: bump the version file"

[[doc]]
label    = "review"
path     = "docs/reviews/seeded-pr.md"
sections = ["Finding", "Evidence"]
