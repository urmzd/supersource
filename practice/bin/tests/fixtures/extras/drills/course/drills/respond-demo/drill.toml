id          = "ops.97"
title       = "A scripted responder restores the prefill pool"
slo_profile = "drill"
step_s      = 1

[[inject]]
kind   = "scale-zero"
target = "{deploy.services.prefill}"

[detect]
alert    = "TTFTBudgetBurnFast"
within_s = 30

[[resolve.check]]
promql = "up == 1"
hold_s = 1

[postmortem]
path     = "docs/postmortems/{date}-respond-demo.md"
sections = ["Summary", "Resolution"]
