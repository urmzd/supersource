id       = "demo.sum"
title    = "The demo sum in four languages against one golden file"
equality = "close"
rtol     = 1e-6
atol     = 1e-6
golden   = "course/fixtures/parity/demo.sum.json"

[fuzz]
generator = "gen/demo_sum.py"
cases     = 50

[[impl]]
name   = "python"
module = "M90.1"
lang   = "python"
driver = "drivers/demo_sum.py"

[[impl]]
name   = "c"
module = "rt.91"
lang   = "c"
driver = "drivers/demo_sum.c"

[[impl]]
name   = "rust"
module = "ds.90"
lang   = "rust"
driver = "drivers/demo_sum.rs"

[[impl]]
name   = "go"
module = "dur.90"
lang   = "go"
driver = "drivers/demo_sum.go"

[[impl]]
name   = "future"
module = "M90.9"
lang   = "python"
driver = "drivers/none.py"
