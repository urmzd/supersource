[q1]
type    = "expr"
expect  = "2*x*cos(x**2)"
vars    = { x = "real" }
check   = "either"
domain  = { x = [-3.0, 3.0] }
forbid  = ["Derivative"]
[[q1.reject]]
answer  = "2*x*cos(x)"

[q2]
type    = "interval"
expect  = "(-oo, -2) U (2, oo)"
[[q2.reject]]
answer  = "[-2, 2]"

[q3.a]
type    = "number"
expect  = "1/2"
exact   = true
[[q3.a.reject]]
answer  = "0.5"

[q3.b]
type    = "bool"
expect  = "true"
[[q3.b.reject]]
answer  = "false"

[q4]
type    = "vector"
expect  = "[[1], [0]]"
up_to   = "scalar"
[[q4.reject]]
answer  = "[[0], [1]]"

[q5]
type    = "proof"
rubric  = ["Defines even as 2k for an integer k", "Writes the sum as 2 times an integer"]
