id             = "ops.90"
title          = "A demo decode pod dies while the prefill pool is gone"
requires       = []
seeded         = true
time_limit_min = 45
slo_profile    = "drill"
symptom        = "PAGE: forge TTFTBudgetBurnFast is firing"
step_s         = 15

[[inject]]
kind   = "pod-kill"
target = "{deploy.services.decode}"
pick   = "random-ready-replica"

[[inject]]
kind   = "scale-zero"
target = "{deploy.services.prefill}"

[[inject]]
kind   = "deploy-patch"
target = "{deploy.services.gateway}"
env    = { TL_GATEWAY__ROUTE_POLICY = "weighted" }

[[inject]]
kind   = "resource-limit"
target = "{deploy.services.decode}"
limits = { memory = "64Mi" }

[[inject]]
kind      = "config-drift"
target    = "{deploy.services.gateway}"
configmap = "forge-runtime"
set       = { "route_policy" = "least_outstanding" }

[detect]
alert    = "TTFTBudgetBurnFast"
within_s = 300

[[resolve.check]]
promql = "histogram_quantile(0.95, sum(rate(gen_ai_server_time_to_first_token_seconds_bucket[5m])) by (le)) < 0.5"
hold_s = 60

[evidence.trace]
service  = "forge-gateway"
services = ["forge-gateway", "forge-engine"]

[[doc]]
label    = "runbook"
path     = "docs/runbooks/kill-demo.md"
sections = ["Symptoms", "Diagnosis", "Mitigation"]

[postmortem]
path     = "docs/postmortems/{date}-kill-demo.md"
sections = ["Summary", "Impact", "Timeline", "Root cause", "Detection", "Resolution", "Action items"]
