openapi: 3.1.0
info:
  title: OpenAI subset v0 (tracer), fixture copy for the harness self-tests
  version: 0.1.0
paths:
  /healthz:
    get:
      responses:
        "200":
          description: healthy
  /v1/completions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: "a completion, or an SSE stream of chunks ending in `data: [DONE]`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Completion"
            text/event-stream:
              x-tl-chunk:
                $ref: "#/components/schemas/CompletionChunk"
        "400":
          description: invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: missing or unknown key (gateway tier)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    CompletionRequest:
      type: object
      required: [model, prompt]
      properties:
        model: {type: string}
        prompt: {type: string}
        max_tokens: {type: integer, minimum: 1}
        temperature: {type: number, minimum: 0, maximum: 2}
        seed: {type: integer}
        stream: {type: boolean}
    Choice:
      type: object
      required: [index, text, finish_reason]
      properties:
        index: {type: integer}
        text: {type: string}
        finish_reason:
          type: [string, "null"]
          enum: [stop, length, null]
    Completion:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: {type: string}
        object: {const: text_completion}
        created: {type: integer}
        model: {type: string}
        choices:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Choice"}
        usage:
          type: object
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens: {type: integer}
            completion_tokens: {type: integer}
            total_tokens: {type: integer}
    CompletionChunk:
      type: object
      required: [id, object, choices]
      properties:
        id: {type: string}
        object: {const: text_completion}
        choices:
          type: array
          items: {$ref: "#/components/schemas/Choice"}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, param, code]
          properties:
            message: {type: string}
            type: {type: string}
            param: {type: [string, "null"]}
            code: {type: [string, "null"]}
