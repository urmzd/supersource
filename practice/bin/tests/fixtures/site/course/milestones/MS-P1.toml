id       = "MS-P1"
title    = "Tracer: tokens stream from your engine through your gateway"
requires = []
pass     = 1
ci       = "pr"
includes = ["MS-M90"]
services = ["engine", "gateway"]

[[step]]
name     = "engine conforms to openapi:v0"
smoke    = true
services = ["engine"]
expect   = { match = "suite", suite = "openapi:v0:engine" }

[[step]]
name   = "gateway conforms to openapi:v0"
smoke  = true
expect = { match = "suite", suite = "openapi:v0:gateway" }

[[step]]
name   = "32 tokens stream through the gateway"
smoke  = true
http   = { method = "POST", url = "{gateway.api_base}/completions", auth = true, json = { model = "bigram", prompt = "Once", max_tokens = 32, temperature = 0, stream = true } }
expect = { match = "sse", min_chunks = 32 }

[[step]]
name   = "32 tokens stream through the kind NodePort"
ci     = "kind"
http   = { method = "POST", url = "{deploy.gateway_url}/v1/completions", auth = true, json = { model = "bigram", prompt = "Once", max_tokens = 32, temperature = 0, stream = true } }
expect = { match = "sse", min_chunks = 32 }

[[step]]
name   = "one trace spans gateway and engine"
ci     = "kind"
expect = { match = "trace", service = "forge-gateway", services = ["forge-gateway", "forge-engine"], spans = ["POST /v1/completions", "engine.decode"], parents = [["engine.decode", "POST /v1/completions"]] }
