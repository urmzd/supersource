id       = "MS-M90"
title    = "Your demo CLI emits the oracle's greedy ids"
requires = ["M90.1"]
pass     = 1
ci       = "pr"

[[step]]
name   = "greedy ids"
run    = "tinyllm"
smoke  = true
argv   = ["generate", "--prompt", "{prompt}", "--max-tokens", "8", "--greedy"]
matrix = { prompt = ["ab", "hello"] }
expect = { match = "tokens-equal", file = "course/fixtures/MS-M90/greedy_{prompt}.json", near_tie = { margin = 1e-3 } }

[[step]]
name   = "progress line"
run    = "tinyllm"
argv   = ["generate", "--prompt", "ab", "--max-tokens", "8", "--greedy"]
expect = { match = "contains", text = "generating 8 tokens" }
