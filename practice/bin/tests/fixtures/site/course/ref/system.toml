# The fixture reference system's harness manifest: milestone roles point at
# course/ref/entry (DESIGN 3.2), copied into a learner repo by the self-tests.
[system]
name = "forge"
version = "0.1.0"
course_version = "0.1.0"

[build]
steps = [["python3", "-c", "print('build ok')"]]

[entry]
tinyllm = ["python3", "python/tinyllm/__main__.py"]
engine  = ["python3", "serve/engine.py", "--config", "{config}"]
gateway = ["python3", "serve/gateway.py", "--config", "{config}"]

[services.engine]
config = "deploy/runtime.dev.toml"
health = "http://127.0.0.1:{health_port}/healthz"
ready_timeout_s = 20

[services.gateway]
config = "deploy/runtime.dev.toml"
health = "http://127.0.0.1:{health_port}/readyz"
after = ["engine"]
ready_timeout_s = 20

[endpoints]
api_base    = "http://127.0.0.1:{gateway.port}/v1"
api_key_env = "TL_API_KEY"

[ci]
local = [["python3", "-c", "print('ci ok')"]]

[deploy]
kube_context = "kind-forge"
namespace    = "forge"
gateway_url  = "http://127.0.0.1:30080"
prometheus   = "http://127.0.0.1:30090"
traces       = "http://127.0.0.1:30686"
services     = { gateway = "deploy/forge-gateway", decode = "deploy/forge-engine-decode", prefill = "deploy/forge-engine-prefill", durable = "statefulset/forge-durable" }
