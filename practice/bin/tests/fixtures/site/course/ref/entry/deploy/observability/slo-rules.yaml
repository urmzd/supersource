# Fixture alert rules (DESIGN 2.11): the TTFT fast and slow burn alerts under
# the `drill` profile windows (5m/25s at 14.4x, 30m/150s at 6x).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forge-slo
spec:
  groups:
    - name: ttft
      rules:
        - alert: TTFTBudgetBurnFast
          expr: |
            (1 - sum(rate(ttft_good[5m])) / sum(rate(ttft_total[5m]))) > 14.4 * 0.05
            and
            (1 - sum(rate(ttft_good[25s])) / sum(rate(ttft_total[25s]))) > 14.4 * 0.05
        - alert: TTFTBudgetBurnSlow
          expr: |
            (1 - sum(rate(ttft_good[30m])) / sum(rate(ttft_total[30m]))) > 6 * 0.05
            and
            (1 - sum(rate(ttft_good[150s])) / sum(rate(ttft_total[150s]))) > 6 * 0.05
