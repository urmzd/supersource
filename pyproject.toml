[project]
name = "supersource"
version = "0.10.0"
description = "Free curriculum for mathematics and algorithm mastery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
]

[tool.ruff.lint]
ignore = ["E402", "E722", "E741", "E711", "E731", "F811", "F821", "F841"]
